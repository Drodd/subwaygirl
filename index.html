<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>地铁睡神</title>
    <!-- 添加 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: white;
        }
        
        #bg-cloud-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }
        
        .bg-cloud {
            position: absolute;
            top: 0;
            height: 100%;
            object-fit: cover;
        }
        
        #bg-train {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        
        #girl-body {
            position: absolute;
            width: auto;
            height: auto;
            transform-origin: center bottom;
            z-index: 5;
            object-fit: contain; /* 确保图片不会被拉伸变形 */
        }
        
        #anchor {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: transparent;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        
        #controls {
            position: absolute;
            bottom: 10%;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 0 20px;
            z-index: 20;
        }
        
        .control-btn {
            width: 80px;
            height: 80px;
            background-color: rgba(255, 255, 255, 0.5);
            border: 2px solid rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0.7;
            transition: opacity 0.2s, transform 0.1s;
            touch-action: none;
            border-radius: 50%;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }
        
        .control-btn:active {
            opacity: 1;
            transform: scale(1.1);
        }
        
        #left-btn {
            position: relative;
            overflow: hidden;
        }
        
        #left-btn::after {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border-top: 20px solid transparent;
            border-right: 35px solid rgba(0, 0, 0, 0.5);
            border-bottom: 20px solid transparent;
        }
        
        #right-btn {
            position: relative;
            overflow: hidden;
        }
        
        #right-btn::after {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border-top: 20px solid transparent;
            border-left: 35px solid rgba(0, 0, 0, 0.5);
            border-bottom: 20px solid transparent;
        }
        
        /* 毛玻璃效果 */
        .glass-effect {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        #game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 99;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease-out;
        }
        
        #game-over-overlay.show {
            opacity: 1;
        }
        
        @keyframes pop-in {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 0;
            }
            40% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 1;
            }
            60% {
                transform: translate(-50%, -50%) scale(0.9);
            }
            80% {
                transform: translate(-50%, -50%) scale(1.05);
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
            }
        }
        
        @keyframes float {
            0%, 100% {
                transform: translate(-50%, -50%) translateY(0);
            }
            50% {
                transform: translate(-50%, -50%) translateY(-8px);
            }
        }
        
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            display: none;
            z-index: 100;
            min-width: 250px;
            max-width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            animation: pop-in 0.6s ease-out, float 3s ease-in-out 0.6s infinite;
            transform-origin: center center;
        }
        
        #restart-btn, #start-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.2);
            transition: background-color 0.2s, transform 0.1s;
        }
        
        @keyframes button-pop {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            60% {
                transform: scale(1.1);
            }
            80% {
                transform: scale(0.95);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        #restart-btn {
            animation: button-pop 0.5s ease-out 0.8s both;
        }
        
        #restart-btn:active, #start-btn:active {
            background-color: #3367d6;
            transform: scale(0.98);
        }
        
        @keyframes fade-in {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        #final-score, #best-score {
            animation: fade-in 0.4s ease-out 0.4s backwards;
        }
        
        #gameover-image {
            animation: fade-in 0.4s ease-out 0.6s backwards;
        }
        
        #angle-display {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 5px 15px;
            border-radius: 15px;
            z-index: 20;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: none; /* 隐藏角度显示，让游戏更加直观 */
        }
        
        #score-display {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Roboto Mono', monospace;
            font-size: 48px;
            font-weight: 700;
            color: white;
            background: none;
            padding: 10px 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            z-index: 20;
            letter-spacing: 2px;
        }
        
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
            text-align: center;
        }
        
        .start-content {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 15px;
            max-width: 80%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        #start-screen h1 {
            margin-bottom: 20px;
            color: #333;
            font-size: 32px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }
        
        #start-screen p {
            margin-bottom: 15px;
            max-width: 600px;
            color: #555;
            line-height: 1.5;
            font-size: 16px;
        }
        
        .highlight {
            color: #ff7675;
            font-weight: bold;
        }
        
        .angle-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 150px;
            background-color: rgba(255, 0, 0, 0.3);
            transform-origin: bottom center;
            z-index: 5;
            display: none; /* 隐藏角度指示器 */
        }
        
        #left-indicator {
            transform: translateX(-50%) rotate(-45deg);
        }
        
        #right-indicator {
            transform: translateX(-50%) rotate(45deg);
        }
        
        /* 加载动画 */
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 300;
            flex-direction: column;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        #loading p {
            color: white;
            margin-top: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="bg-cloud-container">
            <img class="bg-cloud" id="bg-cloud-1" src="img/img_bg_cloud.png" alt="云层背景">
            <img class="bg-cloud" id="bg-cloud-2" src="img/img_bg_cloud.png" alt="云层背景">
        </div>
        <img id="bg-train" src="img/img_bg_train.png" alt="地铁背景">
        <img id="girl-body" src="img/img_girl_body.png" alt="女孩身体">
        <div id="anchor"></div>
        <div id="controls">
            <div id="left-btn" class="control-btn"></div>
            <div id="right-btn" class="control-btn"></div>
        </div>
        <div id="angle-display">0°</div>
        <div id="score-display">00:00.0</div>
        <div class="angle-indicator" id="left-indicator"></div>
        <div class="angle-indicator" id="right-indicator"></div>
        
        <!-- 结算弹窗毛玻璃背景 -->
        <div id="game-over-overlay" class="glass-effect"></div>
        
        <!-- 添加音频元素播放BGM -->
        <audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>
        
        <div id="game-over">
            <h2>她醒了！</h2>
            <p id="final-score" style="font-size: 20px; margin: 10px 0;">她睡了 00:00.0</p>
            <p id="best-score" style="font-size: 16px; color: #777; margin-bottom: 20px;">历史最佳: 00:00.0</p>
            <div id="gameover-image" style="margin: 20px 0; border-radius: 15px; overflow: hidden; min-height: 150px; max-height: 40vh; display: flex; justify-content: center; align-items: center;">
                <img src="" alt="游戏结束场景" style="max-width: 100%; max-height: 100%; object-fit: contain;">
            </div>
            <button id="restart-btn" style="background-color: #4285f4; color: white; padding: 12px 30px; border: none; border-radius: 25px; font-size: 18px; cursor: pointer; transition: transform 0.2s;">接着睡</button>
        </div>
        
        <!-- 开始界面毛玻璃效果 -->
        <div id="start-screen" class="glass-effect">
            <div class="start-content">
                <h1>地铁睡神</h1>
                <p>小女孩在地铁上睡着了...</p>
                <p>用左右按钮保持平衡，避免撞到旁边的乘客</p>
                <p>尽可能让她多睡一会吧！</p>
                <p>（开启手机声音，可以听到音乐哦）</p>
                <button id="start-btn">开始游戏</button>
            </div>
        </div>
        
        <div id="loading">
            <div class="spinner"></div>
            <p>正在加载游戏资源...</p>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
